matrix:
  # No Windows. `autom4te` drives m4 through a POSIX shell (single-quoted
  # arguments, `>` redirection, `< /dev/null`), and the `configure` scripts
  # Autoconf emits are POSIX shell too, so every target in the module is
  # `target_compatible_with` not-Windows.
  platform:
  - debian11
  - ubuntu2004
  - ubuntu2004_arm64
  - ubuntu2204
  - ubuntu2404
  - macos
  - macos_arm64
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets (defaults)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@autoconf//...'
    test_targets:
    - '@autoconf//...'
  verify_no_freeze:
    name: Verify build targets (--freeze=False)
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_flags:
    - '--@autoconf//:freeze=False'
    test_flags:
    - '--@autoconf//:freeze=False'
    build_targets:
    - '@autoconf//...'
    test_targets:
    - '@autoconf//...'
